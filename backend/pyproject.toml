[project]
name = "sqoch-api"
version = "0.1.0"
description = "Small, in-memory Sqoch order demo API"
requires-python = ">=3.15"
dependencies = ["fastapi==0.159.1", "pydantic[email]==2.14.1", "uvicorn==0.54.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "mypy==2.4.0", "pytest==9.1.1", "ruff==0.17.1"]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sqoch_api"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["sqoch_api", "tests"]
