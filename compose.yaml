services:
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '0'
      MP_ENABLE_CHAOS: 'true'
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_ALLOWED_HOSTS: 127.0.0.1,localhost
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

volumes:
  mailpit-data:
